<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>东方角色提示词生成器</title>
  <style>
    :root{--ink:#17201e;--muted:#697572;--paper:#f6f3eb;--panel:rgba(255,255,255,.84);--line:#d9d4c8;--jade:#1f6d61;--jade2:#134d46;--gold:#b58a48;--red:#8b3d37;--shadow:0 18px 55px rgba(39,51,46,.11);--radius:18px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;background:radial-gradient(circle at 10% 4%,rgba(181,138,72,.14),transparent 24rem),radial-gradient(circle at 88% 12%,rgba(31,109,97,.12),transparent 30rem),var(--paper);min-height:100vh}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:linear-gradient(rgba(31,109,97,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(31,109,97,.025) 1px,transparent 1px);background-size:32px 32px}
    button,input,select,textarea{font:inherit}.app{max-width:1600px;margin:auto;padding:24px;position:relative}.masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:14px}.seal{width:48px;height:48px;border:1px solid rgba(139,61,55,.55);color:var(--red);display:grid;place-items:center;border-radius:13px;font-family:serif;font-size:20px;font-weight:700;transform:rotate(-2deg);background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 4px rgba(139,61,55,.05)}h1{font-size:clamp(22px,3vw,32px);font-weight:750;letter-spacing:.08em;margin:0}.subtitle{color:var(--muted);margin:5px 0 0;font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.btn{border:1px solid var(--line);background:rgba(255,255,255,.82);color:var(--ink);padding:9px 13px;border-radius:10px;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}.btn:hover{transform:translateY(-1px);border-color:#aebcb8;box-shadow:0 6px 15px rgba(37,58,52,.08)}.btn.primary{background:var(--jade);border-color:var(--jade);color:white}.btn.danger{color:var(--red)}.btn.small{padding:7px 10px;font-size:13px}.grid{display:grid;grid-template-columns:210px minmax(440px,1fr) minmax(340px,460px);gap:16px;align-items:start}.card{background:var(--panel);border:1px solid rgba(210,205,193,.9);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(14px)}.sidebar{padding:12px;position:sticky;top:16px}.tabs{display:flex;flex-direction:column;gap:7px}.tab{appearance:none;border:0;background:transparent;padding:13px 14px;border-radius:12px;text-align:left;cursor:pointer;color:#46514e;font-weight:650;letter-spacing:.02em;display:flex;align-items:center;gap:10px}.tab .num{font-family:Georgia,serif;color:var(--gold);font-size:13px;width:22px}.tab:hover{background:rgba(31,109,97,.06)}.tab.active{background:linear-gradient(135deg,var(--jade),var(--jade2));color:white;box-shadow:0 8px 20px rgba(31,109,97,.22)}.tab.active .num{color:#eed8ae}.nav-note{border-top:1px solid var(--line);margin:12px 4px 0;padding:13px 6px 3px;color:var(--muted);font-size:12px;line-height:1.65}.editor{padding:20px;min-height:720px}.basic{padding:18px;margin-bottom:16px}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}.section-head h2{margin:0;font-size:19px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.count{font-size:12px;color:var(--jade);background:rgba(31,109,97,.08);padding:6px 9px;border-radius:99px}.basic-grid{display:grid;grid-template-columns:repeat(5,minmax(115px,1fr));gap:10px}.control label,.basic-label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.input,select,textarea{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.92);border-radius:10px;color:var(--ink);outline:none;transition:.15s}.input,select{height:40px;padding:0 11px}textarea{padding:11px;line-height:1.65;resize:vertical}input:focus,select:focus,textarea:focus{border-color:rgba(31,109,97,.65);box-shadow:0 0 0 3px rgba(31,109,97,.1)}.group-title{display:flex;align-items:center;gap:10px;margin:22px 0 10px;color:#394440;font-size:14px;font-weight:750}.group-title:after{content:"";height:1px;background:linear-gradient(90deg,var(--line),transparent);flex:1}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{border:1px solid var(--line);background:rgba(250,249,245,.72);border-radius:13px;padding:12px;transition:.15s}.field:hover{border-color:#bdc9c5}.field.disabled{opacity:.5}.field-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}.enable{appearance:none;width:18px;height:18px;min-width:18px;border:1.5px solid #aeb7b4;border-radius:5px;background:white;display:grid;place-items:center;cursor:pointer}.enable:checked{background:var(--jade);border-color:var(--jade)}.enable:checked:after{content:"✓";font-size:12px;color:white;font-weight:bold}.field-name{font-size:13px;font-weight:700}.custom{margin-top:8px;height:36px!important;font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:106px;overflow:auto;padding:1px}.chip input{position:absolute;opacity:0;pointer-events:none}.chip span{display:block;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:white;font-size:12px;cursor:pointer;transition:.14s}.chip input:checked+span{background:rgba(31,109,97,.11);color:var(--jade2);border-color:rgba(31,109,97,.48);font-weight:650}.preview{position:sticky;top:16px;padding:18px;max-height:calc(100vh - 32px);overflow:auto}.preview h2{margin:0;font-size:18px}.preview-text{min-height:300px;margin-top:13px;font-family:"Microsoft YaHei",sans-serif;font-size:14px;background:#fbfaf6}.preview-actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.lockbox{margin-top:16px;border-top:1px solid var(--line);padding-top:15px}.switch-line{display:flex;align-items:center;justify-content:space-between;gap:10px}.switch{position:relative;width:43px;height:24px;flex:none}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#b8bfbc;border-radius:99px;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.2)}.switch input:checked+.slider{background:var(--jade)}.switch input:checked+.slider:before{transform:translateX(19px)}.lock-title{font-size:14px;font-weight:750}.lock-desc{font-size:12px;color:var(--muted);margin:4px 0 10px;line-height:1.55}.negative{height:112px;font-size:12px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:8px}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,18px);background:#172b27;color:white;border-radius:10px;padding:10px 16px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 12px 35px rgba(0,0,0,.2)}.toast.show{opacity:1;transform:translate(-50%,0)}.empty{padding:40px;text-align:center;color:var(--muted)}.kbd{border:1px solid #ccc7ba;border-bottom-width:2px;padding:1px 5px;border-radius:5px;background:#fff;font-size:10px}.mobile-preview{display:none}.footer{text-align:center;color:#8b938f;font-size:11px;padding:18px}.hidden{display:none!important}
    @media(max-width:1180px){.grid{grid-template-columns:190px 1fr}.preview{grid-column:1/-1;position:relative;top:auto;max-height:none}.basic-grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:760px){.app{padding:12px}.masthead{align-items:flex-start;flex-direction:column}.toolbar{justify-content:flex-start}.grid{display:block}.sidebar{position:relative;top:auto;margin-bottom:12px;padding:8px;overflow:auto}.tabs{flex-direction:row;min-width:max-content}.tab{padding:10px 12px}.nav-note{display:none}.editor{padding:13px;min-height:0}.basic{padding:13px}.basic-grid,.fields{grid-template-columns:1fr}.preview{margin-top:12px;padding:14px}.field{padding:11px}.subtitle{line-height:1.55}.hide-mobile{display:none}}
  </style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="brand"><div class="seal">造相</div><div><h1>东方角色提示词生成器</h1><p class="subtitle">为仙侠 · 武侠 · 修仙角色精确锁定面貌、服饰与器物｜数据仅保存在本地</p></div></div>
    <div class="toolbar">
      <button class="btn" id="randomBtn">✦ 随机角色</button>
      <button class="btn" id="saveBtn">保存配置</button>
      <button class="btn" id="loadBtn">读取配置</button>
      <button class="btn" id="exportBtn">导出 JSON</button>
      <button class="btn" id="importBtn">导入 JSON</button>
      <button class="btn danger" id="clearBtn">清空</button>
      <input type="file" id="fileInput" accept="application/json,.json" hidden>
    </div>
  </header>

  <section class="card basic">
    <div class="section-head"><div><h2>角色基础信息</h2><p>先定角色身份与第一印象，未填写的项目不会写入提示词。</p></div><span class="count">基础设定</span></div>
    <div class="basic-grid">
      <div><label class="basic-label" for="characterName">角色名称</label><input class="input basic-input" id="characterName" data-key="name" placeholder="如：沈照月"></div>
      <div><label class="basic-label" for="gender">性别呈现</label><select class="basic-input" id="gender" data-key="gender"><option value="">不限定</option><option>女性</option><option>男性</option><option>中性</option><option>少年</option><option>少女</option><option>非二元呈现</option></select></div>
      <div><label class="basic-label" for="age">年龄段</label><select class="basic-input" id="age" data-key="age"><option value="">不限定</option><option>孩童（7—12岁）</option><option>少年感（13—17岁）</option><option selected>青年（18—28岁）</option><option>成熟青年（29—39岁）</option><option>中年（40—55岁）</option><option>老年（56岁以上）</option><option>外表年轻、实际高龄</option></select></div>
      <div><label class="basic-label" for="roleType">角色类型</label><input class="input basic-input" id="roleType" data-key="roleType" list="roleTypes" placeholder="选择或输入"><datalist id="roleTypes"><option>清冷剑修</option><option>仙门弟子</option><option>江湖侠客</option><option>魔教少主</option><option>隐世医者</option><option>世家公子</option><option>妖族祭司</option><option>山野灵修</option><option>帝王将相</option><option>游侠刺客</option></datalist></div>
      <div><label class="basic-label" for="temperament">核心气质</label><input class="input basic-input" id="temperament" data-key="temperament" list="temperaments" placeholder="如：清冷疏离"><datalist id="temperaments"><option>清冷疏离</option><option>温润克制</option><option>明艳凌厉</option><option>英气飒爽</option><option>沉静悲悯</option><option>邪魅危险</option><option>少年意气</option><option>仙风道骨</option><option>慵懒不羁</option><option>孤傲威严</option></datalist></div>
    </div>
  </section>

  <div class="grid">
    <aside class="card sidebar"><nav class="tabs" id="tabs"></nav><div class="nav-note">每项左侧勾选框决定是否写入结果。多选项可组合；任何项目都能补充自定义内容。</div></aside>
    <main class="card editor"><div id="moduleHeader"></div><div id="fieldsRoot"></div></main>
    <aside class="card preview">
      <div class="section-head"><div><h2>完整角色提示词</h2><p>会随每次选择自动更新</p></div><span class="count" id="charCount">0 字</span></div>
      <textarea id="promptOutput" class="preview-text" spellcheck="false" aria-label="完整角色提示词"></textarea>
      <div class="preview-actions"><button class="btn primary" id="copyBtn">复制完整提示词</button><button class="btn small" id="refreshBtn" title="按当前选项重新生成">↻</button></div>
      <div class="lockbox">
        <div class="switch-line"><div class="lock-title">一致性锁定</div><label class="switch"><input id="consistencyToggle" type="checkbox" checked><span class="slider"></span></label></div>
        <p class="lock-desc">适合连续出图、三视图和视频。固定同一身份、面部比例及角色标志性元素。</p>
        <textarea id="consistencyText" rows="4">同一角色、同一身份、同一张脸（same character, same identity, same face），严格固定脸型与五官比例、眼型和瞳色、发型与发色、服装结构与配色、配饰位置及武器造型；跨镜头保持年龄、骨相、身形和标志性细节完全一致，不随机改变设计。</textarea>
      </div>
      <div class="lockbox">
        <div class="switch-line"><div class="lock-title">负面约束</div><label class="switch"><input id="negativeToggle" type="checkbox" checked><span class="slider"></span></label></div>
        <p class="lock-desc">可直接编辑，随完整提示词一并复制。</p>
        <textarea id="negativeText" class="negative">避免千篇一律网红脸、过度欧美化五官、夸张高鼻深目、过度磨皮、塑料皮肤、五官漂移、左右眼不对称、发型错乱、服装结构随机变化、配饰缺失、武器变形；避免畸形手、缺指、多指、融合手指、扭曲肢体、错误透视、重复物体、低清晰度、水印、文字、标志。</textarea>
      </div>
      <div class="meta"><span>本地离线运行</span><span><span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> 复制</span></div>
    </aside>
  </div>
  <div class="footer">所有选项与配置均留在你的浏览器中，不会上传。</div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const F=(id,label,options,type='select',group='细节',def='',enabled=false)=>({id,label,options,type,group,def,enabled});
  const modules={
    face:{title:'脸型 / 面部',desc:'从整体骨相到局部五官，精确建立可复现的东方角色面貌。',groups:[
      ['整体轮廓',[F('faceShape','脸型',['标准鹅蛋脸','偏窄鹅蛋脸','修长鹅蛋脸','柔和椭圆脸','标准瓜子脸','略有棱角的瓜子脸','心形脸','小巧圆脸','幼态短圆脸','方圆脸','柔和方脸','清瘦长脸','窄长东方脸','标准菱形脸','高颧骨菱形脸','倒三角脸','梨形脸','英气骨感脸'],'select','', '偏窄鹅蛋脸',true),F('faceRatio','脸宽长比例',['短而偏宽','短而偏窄','标准均衡','中等偏窄','中等偏长','窄长修长','宽长硬朗'],'select','', '中等偏窄',true),F('forehead','额头',['窄而低平','中等自然','宽而平缓','偏高饱满','饱满圆润','清瘦骨感','略微突出'],'select'),F('hairline','发际线',['自然圆弧形','平缓弧形','轻微M形','明显M形','轻微美人尖','清晰美人尖','方形发际线','偏低','偏高','两侧自然后退'],'select')]],
      ['下颌与面中',[F('jawline','下颌线',['纤细柔和','圆润流畅','柔和收窄','自然清晰','清晰利落','紧致流畅','窄而锐利','略带棱角','明显骨感','下颌角轻微明显','下颌角明显','硬朗英气'],'select','', '清晰利落',true),F('jawWidth','下颌宽度',['极窄','偏窄','中等偏窄','标准','中等偏宽','宽阔'],'select'),F('chin','下巴',['小巧圆润','短而圆润','柔和圆下巴','自然微尖','小巧微尖','纤细尖下巴','窄长下巴','方形下巴','宽而平缓','微微前翘','略微后收','中央轻微凹陷'],'select','', '自然微尖',true),F('cheekboneHeight','颧骨高度',['低平','偏低','中等高度','略高','高','明显高颧骨'],'select'),F('cheekboneForm','颧骨形态',['平缓柔和','圆润自然','轻微突出','清晰但不突出','略微外扩','明显外扩','窄而高','宽而平','骨感突出','东方自然平缓型'],'select'),F('cheeks','脸颊',['清瘦','略微凹陷','自然平整','柔和饱满','轻微婴儿肥','明显幼态饱满','苹果肌轻微饱满','苹果肌明显','骨感脸颊'],'select')]],
      ['眉部',[F('browShape','眉型',['自然平眉','纤细平眉','柔和平眉','平直剑眉','英气剑眉','细长剑眉','自然弯眉','柔和弯月眉','柳叶眉','新月眉','远山眉','清晰眉峰眉','微挑眉','上扬眉','野生自然眉','古典东方长眉'],'select','', '古典东方长眉',true),F('browThickness','眉毛粗细',['极细','纤细','中等偏细','自然中等','中等偏粗','粗而英气'],'select'),F('browDensity','眉毛浓密度',['稀疏轻淡','疏密自然','中等浓密','浓密根根分明','野生浓密'],'select'),F('browEyeDistance','眉眼距离',['较近、显得凌厉','中等自然','略宽、显得舒展','较宽、显得温和'],'select')]],

      ['使用状态',[F('carryPosition','佩戴位置',['腰侧横佩','腰后斜佩','背后斜背','背后竖背','手持下垂','双手执握','藏于袖中','悬于身侧','置于琴匣 / 武器匣中'],'select','', '腰侧横佩',true),F('weaponWear','磨损状态',['全新无痕','保养良好、轻微划痕','自然使用磨损','刃口细小缺口','明显战斗划痕','锈迹斑驳','残破古旧'],'select'),F('effects','特殊效果',['无特殊效果','刃口微泛寒光','淡青色灵气流动','金色符文微光','幽蓝剑气','红色煞气','雷电缠绕','冰霜凝结','火焰附着','黑雾缭绕','花瓣环绕','水流般灵力','空间轻微扭曲'],'multi')]]
    ]}
  };
  const order=['face','hair','clothing','accessories','weapon'];
  const icons={face:'01',hair:'02',clothing:'03',accessories:'04',weapon:'05'};
  const state={active:'face',values:{},enabled:{},custom:{}};
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

  function allFields(){return order.flatMap(k=>modules[k].groups.flatMap(g=>g[1].map(f=>({...f,module:k}))));}
  function initializeState(){allFields().forEach(f=>{state.enabled[f.id]=!!f.enabled;state.values[f.id]=Array.isArray(f.def)?[...f.def]:(f.def||'');state.custom[f.id]='';});}
  function renderTabs(){
    $('#tabs').innerHTML=order.map(k=>`<button class="tab ${state.active===k?'active':''}" data-tab="${k}"><span class="num">${icons[k]}</span>${modules[k].title}</button>`).join('');
    $$('#tabs .tab').forEach(b=>b.onclick=()=>{state.active=b.dataset.tab;renderTabs();renderModule();});
  }
  function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function fieldHTML(f){
    const val=state.values[f.id];
    let control='';
    if(f.type==='multi'){
      const arr=Array.isArray(val)?val:[];
      control=`<div class="chips">${f.options.map((o,i)=>`<label class="chip"><input type="checkbox" data-option="${esc(o)}" ${arr.includes(o)?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`;
    }else{
      control=`<select class="field-select"><option value="">请选择…</option>${f.options.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    }
    return `<div class="field ${state.enabled[f.id]?'':'disabled'}" data-id="${f.id}"><div class="field-top"><input class="enable" type="checkbox" ${state.enabled[f.id]?'checked':''}><span class="field-name">${f.label}</span></div>${control}<input class="input custom" value="${esc(state.custom[f.id])}" placeholder="自定义补充（可留空）"></div>`;
  }
  function renderModule(){
    const m=modules[state.active];
    const n=m.groups.reduce((a,g)=>a+g[1].length,0);
    $('#moduleHeader').innerHTML=`<div class="section-head"><div><h2>${m.title}</h2><p>${m.desc}</p></div><span class="count">${n} 项</span></div>`;
    $('#fieldsRoot').innerHTML=m.groups.map(g=>`<div class="group-title">${g[0]}</div><div class="fields">${g[1].map(fieldHTML).join('')}</div>`).join('');
    $$('.field').forEach(el=>{
      const id=el.dataset.id, f=allFields().find(x=>x.id===id);
      const enable=el.querySelector('.enable');
      enable.onchange=()=>{state.enabled[id]=enable.checked;el.classList.toggle('disabled',!enable.checked);generate();};
      const sel=el.querySelector('.field-select');
      if(sel)sel.onchange=()=>{state.values[id]=sel.value;if(sel.value){state.enabled[id]=true;enable.checked=true;el.classList.remove('disabled');}generate();};
      el.querySelectorAll('[data-option]').forEach(c=>c.onchange=()=>{state.values[id]=[...el.querySelectorAll('[data-option]:checked')].map(x=>x.dataset.option);if(state.values[id].length){state.enabled[id]=true;enable.checked=true;el.classList.remove('disabled');}generate();});
      const custom=el.querySelector('.custom');
      custom.oninput=()=>{state.custom[id]=custom.value.trim();if(custom.value.trim()){state.enabled[id]=true;enable.checked=true;el.classList.remove('disabled');}generate();};
    });
  }
  function picked(id){
    if(!state.enabled[id])return '';
    const v=state.values[id], c=state.custom[id]?.trim();
    const parts=[];if(Array.isArray(v))parts.push(...v);else if(v)parts.push(v);if(c)parts.push(c);
    return [...new Set(parts)].join('、');
  }
  function phrase(id,prefix='',suffix=''){const v=picked(id);return v?`${prefix}${v}${suffix}`:'';}
  function join(items,sep='，'){return items.filter(Boolean).join(sep);}
  function basics(){const o={};$$('.basic-input').forEach(e=>o[e.dataset.key]=e.value.trim());return o;}
  function generate(){
    const b=basics(), parts=[];
    const identity=join([
      b.name?`角色名为“${b.name}”`:'一位原创东方角色',
      b.gender?`呈${b.gender}形象`:'', b.age?`年龄感为${b.age}`:'', b.roleType?`身份是${b.roleType}`:'', b.temperament?`第一印象${b.temperament}`:''
    ]);
    parts.push(`${identity}。`);
    const faceShape=join([phrase('faceShape'),phrase('faceRatio','面部比例'),phrase('forehead','额头'),phrase('hairline','发际线为')]);
    const bone=join([phrase('jawline','下颌线'),phrase('jawWidth','下颌'),phrase('chin','下巴'),phrase('cheekboneHeight','颧骨位置'),phrase('cheekboneForm','颧骨轮廓'),phrase('cheeks','脸颊')]);
    const brow=join([phrase('browShape'),phrase('browThickness','眉形'),phrase('browDensity'),phrase('browEyeDistance','眉眼距离')]);
    const eyes=join([phrase('eyeShape'),phrase('eyeSize','眼睛'),phrase('eyeLength'),phrase('eyeTail','眼尾'),phrase('eyeInner','眼头'),phrase('eyelid'),phrase('aegyo','卧蚕'),phrase('eyeDistance'),phrase('lashes','睫毛')]);
    const iris=join([phrase('irisColor','虹膜呈'),phrase('irisSize','虹膜'),phrase('gaze','眼神')]);
    const nose=join([phrase('noseRoot','山根'),phrase('noseBridge'),phrase('noseWidth','鼻部'),phrase('noseTip','鼻尖'),phrase('noseWing','鼻翼'),phrase('nostril','鼻孔')]);
    const lips=join([phrase('mouthSize','嘴巴'),phrase('lipThickness'),phrase('lipShape'),phrase('cupidBow'),phrase('lipRatio'),phrase('mouthCorner','嘴角'),phrase('lipColor','唇色')]);
    const skin=join([phrase('skinTone','肤色'),phrase('skinTexture','皮肤'),phrase('marks','辨识标记为'),phrase('ageFeeling','呈现'),phrase('overallAura','整体面相')]);
    const faceAll=[faceShape&&`面部是${faceShape}`,bone&&`骨相表现为${bone}`,brow&&`眉部采用${brow}`,eyes&&`眼部为${eyes}`,iris,nose&&`鼻部线条为${nose}`,lips&&`唇部为${lips}`,skin].filter(Boolean);
    if(faceAll.length)parts.push(`面部细节：${faceAll.join('；')}。`);

    const hairBase=join([phrase('hairLength'),phrase('hairColor'),phrase('hairTexture'),phrase('bangs')]);
    const hairStruct=join([phrase('tieStyle'),phrase('bun'),phrase('braid','搭配'),phrase('templeHair')]);
    const hairMotion=join([phrase('looseHair'),phrase('strandState'),phrase('wind','呈'),phrase('hairOrnaments','点缀')]);
    if(hairBase||hairStruct||hairMotion)parts.push(`发型设计：${join([hairBase&&`头发${hairBase}`,hairStruct&&`整体${hairStruct}`,hairMotion], '；')}。`);

    const clothStruct=join([phrase('clothingStyle'),phrase('innerLayer','内搭'),phrase('outerRobe'),phrase('top','上身着'),phrase('bottom','下身配')]);
    const cut=join([phrase('sleeves'),phrase('collar'),phrase('waist'),phrase('layers','形成')]);
    const material=join([phrase('fabric','使用'),phrase('clothingColors','主色为'),phrase('patterns','饰以')]);
    const wear=join([phrase('aging'),phrase('damage')]);
    const full=join([phrase('boots','脚穿'),phrase('cape'),phrase('silhouette','整体廓形')]);
    if(clothStruct||cut||material||wear||full)parts.push(`服装造型：以${clothStruct||'东方幻想服饰'}为主体；${join([cut,material,wear&&`保留${wear}`,full],'；')}。`);

    const accHead=join([phrase('headpiece'),phrase('pin'),phrase('earrings'),phrase('mask'),phrase('hat')]);
    const accBody=join([phrase('necklace'),phrase('bracers'),phrase('waistAccessories'),phrase('jade'),phrase('sachet')]);
    const accCarry=join([phrase('bag'),phrase('signatureAccessory','最醒目的标志是')]);
    if(accHead||accBody||accCarry)parts.push(`配饰安排：${join([accHead,accBody,accCarry],'；')}，位置清楚、数量克制且符合角色身份。`);

    const wc=picked('weaponClass');
    if(wc==='无武器') parts.push('武器设定：角色不携带任何武器。');
    else{
      const weaponMain=join([wc,phrase('weaponType'),phrase('weaponSize')]);
      const weaponMat=join([phrase('weaponMaterial','以'),phrase('weaponColor','整体呈'),phrase('weaponPattern','表面带有')]);
      const weaponParts=join([phrase('guard'),phrase('grip'),phrase('sheath')]);
      const weaponUse=join([phrase('carryPosition'),phrase('weaponWear'),phrase('effects')]);
      if(weaponMain||weaponMat||weaponParts||weaponUse)parts.push(`武器设定：携带${weaponMain||'东方兵器'}；${join([weaponMat,weaponParts,weaponUse],'；')}，武器结构完整、比例合理。`);
    }
    const textureBits=[picked('skinTexture'),picked('fabric'),picked('aging'),picked('damage'),picked('weaponMaterial'),picked('weaponWear')].filter(Boolean);
    if(textureBits.length)parts.push(`材质细节强调真实可触的层次：${[...new Set(textureBits)].join('、')}，光影能区分皮肤、布料、金属、玉石与木材，不做塑料化处理。`);
    if($('#consistencyToggle').checked&&$('#consistencyText').value.trim())parts.push(`一致性强约束：${$('#consistencyText').value.trim()}`);
    if($('#negativeToggle').checked&&$('#negativeText').value.trim())parts.push(`负面约束：${$('#negativeText').value.trim()}`);
    const text=parts.join('\n\n');$('#promptOutput').value=text;$('#charCount').textContent=`${text.length} 字`;
  }
  function serialize(){return {version:1,savedAt:new Date().toISOString(),basic:basics(),state:{values:state.values,enabled:state.enabled,custom:state.custom},consistency:{enabled:$('#consistencyToggle').checked,text:$('#consistencyText').value},negative:{enabled:$('#negativeToggle').checked,text:$('#negativeText').value}};}
  function applyConfig(data){
    if(!data||typeof data!=='object'||!data.state)throw new Error('配置格式不正确');
    $$('.basic-input').forEach(e=>{if(data.basic&&Object.hasOwn(data.basic,e.dataset.key))e.value=data.basic[e.dataset.key]??'';});
    const validIds=new Set(allFields().map(f=>f.id));
    for(const id of validIds){if(Object.hasOwn(data.state.values||{},id))state.values[id]=data.state.values[id];if(Object.hasOwn(data.state.enabled||{},id))state.enabled[id]=!!data.state.enabled[id];if(Object.hasOwn(data.state.custom||{},id))state.custom[id]=String(data.state.custom[id]??'');}
    if(data.consistency){$('#consistencyToggle').checked=data.consistency.enabled!==false;$('#consistencyText').value=data.consistency.text||'';}
    if(data.negative){$('#negativeToggle').checked=data.negative.enabled!==false;$('#negativeText').value=data.negative.text||'';}
    renderModule();generate();
  }
  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1900);}
  async function copyPrompt(){
    const text=$('#promptOutput').value;try{await navigator.clipboard.writeText(text);}catch(e){$('#promptOutput').select();document.execCommand('copy');window.getSelection()?.removeAllRanges();}toast('完整提示词已复制');
  }
  function randomize(){
    allFields().forEach(f=>{const chance=f.module==='face'?.88:f.module==='hair'?.78:f.module==='clothing'?.76:f.module==='weapon'?.58:.42;state.enabled[f.id]=Math.random()<chance;state.custom[f.id]='';if(f.type==='multi'){const shuffled=[...f.options].sort(()=>Math.random()-.5);state.values[f.id]=state.enabled[f.id]?shuffled.slice(0,Math.random()<.7?1:2):[];}else state.values[f.id]=f.options[Math.floor(Math.random()*f.options.length)];});
    const names=['沈照月','谢临川','云无咎','顾长霄','闻人雪','燕归尘','陆青梧','白砚秋'];const roles=['清冷剑修','江湖游侠','隐世医者','妖族祭司','魔教少主','仙门弟子','山野灵修','游侠刺客'];const vibes=['清冷疏离','温润克制','英气飒爽','明艳凌厉','沉静悲悯','慵懒不羁'];
    $('#characterName').value=names[Math.floor(Math.random()*names.length)];$('#gender').value=['女性','男性','中性'][Math.floor(Math.random()*3)];$('#age').value=['少年感（13—17岁）','青年（18—28岁）','成熟青年（29—39岁）'][Math.floor(Math.random()*3)];$('#roleType').value=roles[Math.floor(Math.random()*roles.length)];$('#temperament').value=vibes[Math.floor(Math.random()*vibes.length)];
    renderModule();generate();toast('已随机生成一位角色');
  }
  function clearAll(){
    $$('.basic-input').forEach(e=>e.value='');initializeState();allFields().forEach(f=>{state.enabled[f.id]=false;state.values[f.id]=f.type==='multi'?[]:'';});$('#consistencyToggle').checked=true;$('#negativeToggle').checked=true;renderModule();generate();toast('已清空全部选择');
  }
  initializeState();renderTabs();renderModule();
  $$('.basic-input').forEach(e=>e.addEventListener('input',generate));
  ['consistencyToggle','consistencyText','negativeToggle','negativeText'].forEach(id=>$('#'+id).addEventListener('input',generate));
  $('#promptOutput').addEventListener('input',()=>$('#charCount').textContent=`${$('#promptOutput').value.length} 字`);
  $('#copyBtn').onclick=copyPrompt;$('#refreshBtn').onclick=generate;$('#randomBtn').onclick=randomize;$('#clearBtn').onclick=()=>{if(confirm('确定清空所有角色选择吗？'))clearAll();};
  $('#saveBtn').onclick=()=>{localStorage.setItem('orientalCharacterPromptConfig',JSON.stringify(serialize()));toast('当前配置已保存在本浏览器');};
  $('#loadBtn').onclick=()=>{const raw=localStorage.getItem('orientalCharacterPromptConfig');if(!raw)return toast('还没有已保存的配置');try{applyConfig(JSON.parse(raw));toast('已读取保存的配置');}catch(e){toast('读取失败：'+e.message);}};
  $('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(serialize(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=($('#characterName').value.trim()||'东方角色')+'_角色配置.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800);toast('配置 JSON 已导出');};
  $('#importBtn').onclick=()=>$('#fileInput').click();
  $('#fileInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{applyConfig(JSON.parse(await file.text()));toast('配置导入成功');}catch(err){toast('导入失败：'+err.message);}e.target.value='';};
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();copyPrompt();}});
  generate();
  window.CharacterPromptApp={serialize,applyConfig,generate,randomize,clearAll,state,modules};
})();
</script>
